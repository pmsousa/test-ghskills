name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
      - '**.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        # az acr build runs the Docker build in the cloud — no local Docker daemon needed.
        # Requires the service principal to have AcrPush role on the registry.
        run: |
          az acr build \
            --registry ${{ vars.ACR_NAME }} \
            --image blog:${{ github.sha }} \
            --image blog:latest \
            ./src

      - name: Deploy new revision to Container Apps
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image ${{ vars.ACR_LOGIN_SERVER }}/blog:${{ github.sha }}

      - name: Show blog URL
        run: |
          az containerapp show \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv
