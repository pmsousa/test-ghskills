name: Terraform

on:
    pull_request:
        branches: [main]
        paths:
            - 'infra/**'
            - '.github/workflows/terraform.yml'
    push:
        branches: [main]
        paths:
            - 'infra/**'

env:
    TF_WORKING_DIR: ./infra
    TF_VAR_FILE: environments/production/terraform.tfvars
    TF_BACKEND_CONFIG: environments/production/backend.hcl

jobs:
    terraform:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: ${{ github.event_name == 'push' && 'production' || '' }}
        permissions:
            id-token: write
            contents: read
            pull-requests: write
            variables: write

        steps:
            - uses: actions/checkout@v4

            - uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: '~1.9'

            - name: Terraform Init
              working-directory: ${{ env.TF_WORKING_DIR }}
              run: terraform init -backend-config=${{ env.TF_BACKEND_CONFIG }}

            - name: Terraform Format Check
              working-directory: ${{ env.TF_WORKING_DIR }}
              run: terraform fmt -check -recursive

            - name: Terraform Validate
              working-directory: ${{ env.TF_WORKING_DIR }}
              run: terraform validate

            - name: Terraform Plan
              id: plan
              working-directory: ${{ env.TF_WORKING_DIR }}
              run: terraform plan -var-file=${{ env.TF_VAR_FILE }} -out=tfplan -no-color
              continue-on-error: true

            - name: Post plan to PR
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const output = `#### Terraform Plan 📋
                      \`\`\`
                      ${{ steps.plan.outputs.stdout }}
                      \`\`\`
                      *Plan outcome: ${{ steps.plan.outcome }}*`;
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: output
                      });

            - name: Terraform Apply
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              working-directory: ${{ env.TF_WORKING_DIR }}
              run: terraform apply -var-file=${{ env.TF_VAR_FILE }} -auto-approve -no-color

            - name: Export Terraform outputs as GitHub variables
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              working-directory: ${{ env.TF_WORKING_DIR }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh variable set ACR_NAME \
                    --repo ${{ github.repository }} \
                    --body "$(terraform output -raw acr_name)"
                  gh variable set ACR_LOGIN_SERVER \
                    --repo ${{ github.repository }} \
                    --body "$(terraform output -raw acr_login_server)"
                  gh variable set CONTAINER_APP_NAME \
                    --repo ${{ github.repository }} \
                    --body "$(terraform output -raw container_app_name)"
                  gh variable set RESOURCE_GROUP \
                    --repo ${{ github.repository }} \
                    --body "$(terraform output -raw resource_group_name)"
